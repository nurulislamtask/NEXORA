# Runs when a commit message on migrate/tauri-react contains [build] (builds) or [release] (builds and publishes a PRE-release). Unsigned, no secrets needed.
name: Build desktop
on: {push: {branches: [migrate/tauri-react]}}
jobs:
  desktop:
    if: contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release]')
    strategy: {fail-fast: false, matrix: {os: [windows-latest, ubuntu-22.04, macos-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm install
      - run: npx tauri icon src-tauri/app-icon.png
      - run: npm test
      - run: npx tauri build
        env: {VITE_SUPABASE_URL: "${{ vars.VITE_SUPABASE_URL }}", VITE_SUPABASE_ANON_KEY: "${{ vars.VITE_SUPABASE_ANON_KEY }}"}
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
  android:
    if: contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "aarch64-linux-android"}
      - name: Use the runner's preinstalled Android SDK/NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME NDK=$ANDROID_NDK_HOME"; ls "$ANDROID_HOME/ndk" || true
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm install
      - run: npx tauri icon src-tauri/app-icon.png
      - run: npx tauri android init
      - name: Build debug-signed APK (arm64)
        run: npx tauri android build --apk --debug --target aarch64
        env: {VITE_SUPABASE_URL: "${{ vars.VITE_SUPABASE_URL }}", VITE_SUPABASE_ANON_KEY: "${{ vars.VITE_SUPABASE_ANON_KEY }}"}
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  release:
    needs: [desktop, android]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist-artifacts}
      - name: Create pre-release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="v0.1.0-preview.${{ github.run_number }}"
          cp .github/release-notes.md notes.md
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "NEXORA $TAG (preview)" --notes-file notes.md $(find dist-artifacts -type f)
