# DRAFT, never run. Needs secrets: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD), SUPABASE_URL/ANON_KEY; Android signing secrets for APK/AAB.
name: Release
on: {push: {tags: ['v*.*.*']}}
permissions: {contents: write}
jobs:
  desktop:
    strategy: {matrix: {os: [windows-latest, macos-latest, ubuntu-22.04]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install && npm test
      - uses: tauri-apps/tauri-action@v0
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}", TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"}
        with: {tagName: "${{ github.ref_name }}", releaseName: "NEXORA ${{ github.ref_name }}", releaseDraft: true, includeUpdaterJson: true}
  # android: TODO after `tauri android init` has been run locally and committed (src-tauri/gen/android).
