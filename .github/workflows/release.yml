# Triggered by tags like v1.0.0. Desktop/Android jobs are drafted but UNTESTED (no Flutter in the authoring environment).
name: Release
on: {push: {tags: ['v*.*.*']}}
permissions: {contents: write}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs && flutter test
      # Requires secrets: ANDROID_KEYSTORE_B64, ANDROID_KEY_PROPERTIES, SUPABASE_URL, SUPABASE_ANON_KEY
      - run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/release.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with: {name: android, path: "build/app/outputs/**/*.{apk,aab}"}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter config --enable-windows-desktop; flutter pub get; dart run build_runner build --delete-conflicting-outputs; flutter test; flutter build windows --release
      # TODO: wrap build/windows/x64/runner/Release with Inno Setup for the installer EXE
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: build/windows/x64/runner/Release}
  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: find . -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} + > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with: {generate_release_notes: true, files: "**/*.apk\n**/*.aab\nSHA256SUMS.txt"}
