name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install && npm run typecheck && npm test
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --edition 2021 --test src-tauri/src/sync/conflict.rs -o /tmp/t && /tmp/t
  sql:
    runs-on: ubuntu-latest
    services: {pg: {image: "postgres:16", env: {POSTGRES_PASSWORD: pw}, ports: ["5432:5432"]}}
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PGPASSWORD=pw; P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          for f in supabase/tests/00_stub_supabase.sql supabase/migrations/*.sql supabase/tests/rls_test.sql; do $P -f $f; done
