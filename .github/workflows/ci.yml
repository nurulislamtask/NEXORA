name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
  sql:
    runs-on: ubuntu-latest
    services:
      pg: {image: "postgres:16", env: {POSTGRES_PASSWORD: pw}, ports: ["5432:5432"]}
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PGPASSWORD=pw; P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          for f in supabase/tests/00_stub_supabase.sql supabase/migrations/*.sql supabase/tests/rls_test.sql; do $P -f $f; done
